<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Boundr — Visa Details</title>

  <!-- Open Graph / iMessage link preview -->
  <meta property="og:site_name" content="Boundr"/>
  <meta property="og:type"      content="website"/>
  <meta id="og-title"       property="og:title"       content="Check out this visa on Boundr"/>
  <meta id="og-description" property="og:description" content="Discover visa opportunities with Boundr"/>
  <meta id="og-image"       property="og:image"       content=""/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --radius-card: 24px;
      --blue: #2563eb;
      --green: #16a34a;
      --green-bg: rgba(34,197,94,.12);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      background: #f2f2f7;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }

    /* ── Top bar ── */
    .topbar {
      width: 100%;
      max-width: 440px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .topbar-logo {
      width: 34px; height: 34px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .topbar-name {
      font-size: 17px;
      font-weight: 700;
      color: #111;
    }
    .topbar-tagline {
      font-size: 12px;
      color: #888;
    }

    /* ── Card ── */
    .card {
      width: 100%;
      max-width: 440px;
      border-radius: var(--radius-card);
      overflow: hidden;
      background: #fff;
      box-shadow: 0 8px 32px rgba(0,0,0,.10);
    }

    /* Hero */
    .hero {
      position: relative;
      height: 220px;
      background: #1a6bb5;
      overflow: hidden;
    }
    .hero-img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .hero-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 25%, rgba(0,0,0,.62) 100%);
    }
    .hero-content {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 20px;
    }
    .country-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,255,255,.20);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 999px;
      padding: 4px 10px 4px 4px;
      margin-bottom: 10px;
    }
    .country-code {
      width: 26px; height: 26px;
      background: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 800;
      color: #111;
      flex-shrink: 0;
    }
    .country-name {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,.92);
      letter-spacing: .8px;
      text-transform: uppercase;
    }
    .visa-name {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      line-height: 1.25;
    }

    /* Body */
    .body { padding: 20px; }

    .description {
      font-size: 14px;
      line-height: 1.6;
      color: #333;
      margin-bottom: 18px;
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    .stat {
      background: #f5f5f7;
      border-radius: 14px;
      padding: 12px 10px;
    }
    .stat-icon { font-size: 14px; margin-bottom: 5px; display: block; }
    .stat-label { font-size: 10px; color: #888; font-weight: 500; display: block; margin-bottom: 3px; }
    .stat-value { font-size: 12px; font-weight: 700; color: #111; line-height: 1.4; }

    /* CTAs */
    .ctas {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity .15s;
      cursor: pointer;
      border: none;
    }
    .btn:active { opacity: .78; }
    .btn-primary {
      background: var(--blue);
      color: #fff;
    }
    .btn-secondary {
      background: #f5f5f7;
      color: #111;
    }
    .btn-icon { font-size: 17px; }

    /* Footer */
    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: #aaa;
    }

    /* Loading / error */
    .state {
      max-width: 440px;
      width: 100%;
      padding: 60px 20px;
      text-align: center;
      color: #888;
    }
    .state-title { font-size: 18px; font-weight: 600; color: #333; margin-bottom: 8px; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      body        { background: #1c1c1e; }
      .card       { background: #2c2c2e; box-shadow: 0 8px 32px rgba(0,0,0,.4); }
      .topbar-name { color: #f5f5f7; }
      .description { color: #ccc; }
      .stat       { background: #3a3a3c; }
      .stat-value { color: #f5f5f7; }
      .btn-secondary { background: #3a3a3c; color: #f5f5f7; }
      .footer     { color: #555; }
      .state-title { color: #f5f5f7; }
    }
  </style>
</head>
<body>

  <!-- Top Boundr bar -->
  <div class="topbar">
    <img class="topbar-logo" src="../boundr-logo.png" alt="Boundr"
         onerror="this.style.background='#2563eb';this.src='data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs='"/>
    <div>
      <div class="topbar-name">Boundr</div>
      <div class="topbar-tagline">Discover your next visa</div>
    </div>
  </div>

  <div id="root"></div>

  <p class="footer">Shared via Boundr · <a href="#" id="app-store-link" style="color:inherit">Download the app</a></p>

<script>
const APP_STORE_URL = "https://apps.apple.com/app/id6772166750";

function heroGradient(region) {
  const g = {
    "Europe":      "#385ec2, #1a316b",
    "Americas":    "#20a467, #0a5a3c",
    "Asia":        "#bf6a37, #722f1a",
    "Oceania":     "#3489bf, #0d3d62",
    "Middle East": "#9951a5, #5c1a6b",
  };
  return `linear-gradient(135deg, ${g[region] || "#606065, #38383d"})`;
}

async function loadVisa() {
  const root   = document.getElementById("root");
  const params = new URLSearchParams(window.location.search);
  const id     = params.get("id");

  if (!id) { return showError("No visa specified."); }

  let visas;
  try {
    const res = await fetch("visas.json");
    visas = await res.json();
  } catch {
    return showError("Couldn't load visa data.");
  }

  const visa = visas.find(v => v.id === id);
  if (!visa) { return showError("Visa not found."); }

  // Update <title> and OG tags
  document.title = `${visa.visaName} — ${visa.country} | Boundr`;
  document.getElementById("og-title").content       = `${visa.visaName} — ${visa.country}`;
  document.getElementById("og-description").content = visa.description;
  if (visa.heroImageURL) document.getElementById("og-image").content = visa.heroImageURL;

  // Update App Store link
  document.getElementById("app-store-link").href = APP_STORE_URL;

  root.innerHTML = `
    <div class="card">
      <div class="hero" style="background:${heroGradient(visa.region)}">
        ${visa.heroImageURL
          ? `<img class="hero-img" src="${visa.heroImageURL}" alt="${visa.country}" loading="eager"/>`
          : ""}
        <div class="hero-scrim"></div>
        <div class="hero-content">
          <div class="country-badge">
            <div class="country-code">${visa.countryCode}</div>
            <span class="country-name">${visa.country}</span>
          </div>
          <div class="visa-name">${visa.visaName}</div>
        </div>
      </div>

      <div class="body">
        <p class="description">${visa.description}</p>

        <div class="stats">
          <div class="stat">
            <span class="stat-icon">⏱</span>
            <span class="stat-label">Duration</span>
            <span class="stat-value">${visa.duration}</span>
          </div>
          <div class="stat">
            <span class="stat-icon">📅</span>
            <span class="stat-label">Processing</span>
            <span class="stat-value">${visa.processingTime}</span>
          </div>
          <div class="stat">
            <span class="stat-icon">💳</span>
            <span class="stat-label">Cost</span>
            <span class="stat-value">${visa.cost}</span>
          </div>
        </div>

        <div class="ctas">
          <a class="btn btn-primary" href="${APP_STORE_URL}" target="_blank">
            <span class="btn-icon">📲</span> Get Boundr — It's Free
          </a>
          ${visa.applicationURL
            ? `<a class="btn btn-secondary" href="${visa.applicationURL}" target="_blank">
                <span class="btn-icon">🌐</span> Official Application Page
               </a>`
            : ""}
        </div>
      </div>
    </div>
  `;
}

function showError(msg) {
  document.getElementById("root").innerHTML = `
    <div class="state">
      <div class="state-title">Oops</div>
      <p>${msg}</p>
    </div>`;
}

loadVisa();
</script>
</body>
</html>
